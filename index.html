<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>joqqizaptiriqi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo-area">
                <!-- Kuchukcha logosi -->
                <svg class="dog-logo" viewBox="0 0 24 24" width="36" height="36" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10 5.172C10 3.782 8.423 2.679 6.5 3c-1.5.25-2.5 1.5-2.5 3 0 1.5.5 2.5 1.5 3.5"></path>
                    <path d="M14 5.172c0-1.39 1.577-2.493 3.5-2.172 1.5.25 2.5 1.5 2.5 3 0 1.5-.5 2.5-1.5 3.5"></path>
                    <path d="M12 15c-3.314 0-6-2.686-6-6 0-1.5 1-3 2.5-3 .8 0 1.5.4 2 1 .5-.6 1.2-1 2-1 1.5 0 2.5 1.5 2.5 3 0 3.314-2.686 6-6 6z"></path>
                    <path d="M12 15v3"></path>
                    <path d="M9 18h6"></path>
                    <path d="M9 21h6"></path>
                </svg>
                <h1>joqqizaptiriqi</h1>
            </div>
            <div class="stats-top">
                <div id="timer">60</div>
            </div>
        </header>

        <!-- Boshqaruv va Rejalar -->
        <div class="controls">
            <div class="modes">
                <button id="mode-random" class="active">Tasodifiy So'zlar</button>
                <button id="mode-custom">O'z Matnim</button>
            </div>
            <div class="time-selectors">
                <button class="time-btn active" data-time="1">1m</button>
                <button class="time-btn" data-time="2">2m</button>
                <button class="time-btn" data-time="3">3m</button>
                <button class="time-btn" data-time="5">5m</button>
                <button class="time-btn" data-time="10">10m</button>
            </div>
        </div>

        <!-- Shaxsiy matn kiritish maydoni (2-variant uchun) -->
        <div id="custom-container" class="custom-container hidden">
            <textarea id="custom-input" placeholder="O'z matningizni shu yerga yozing yoki tashlang (Paste qiling)..."></textarea>
            <button id="start-custom-btn">Matnni yuklash</button>
        </div>

        <!-- Matn yozish maydoni -->
        <div class="typing-section" id="typing-section">
            <div id="word-display" class="word-display" tabindex="0"></div>
            <div class="restart-container">
                <button id="restart-btn" title="Qaytadan boshlash">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                </button>
            </div>
        </div>

        <!-- Natijalar Ekrani -->
        <div id="result-screen" class="result-screen hidden">
            <h2>Natijalar</h2>
            <div class="result-stats">
                <div class="stat-box">
                    <span class="stat-label">WPM (Tezlik)</span>
                    <span id="res-wpm" class="stat-value">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Aniqlik</span>
                    <span id="res-acc" class="stat-value">0%</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Xatolar</span>
                    <span id="res-err" class="stat-value">0</span>
                </div>
            </div>
            <button id="play-again-btn">Yana o'ynash</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
